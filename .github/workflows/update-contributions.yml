name: Auto Sync Open Source Contributions

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI
  push:
    branches:
      - main
    paths:
      - '.github/**'

permissions:
  contents: write

jobs:
  sync-contributions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update README with latest PRs and memberships
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/update_readme.py

      - name: Commit and push as kavix
        run: |
          git config --local user.name "Kavindu Sachinthe"
          git config --local user.email "kavix@yahoo.com"
          if [[ -n $(git status --porcelain) ]]; then
            git add README.md
            git commit -m "docs: auto-sync open source contributions [skip ci]"
            git push
          else
            echo "No changes to commit. README is up to date."
          fi
